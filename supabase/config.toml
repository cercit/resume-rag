# Supabase CLI config for project ref jkionnbbtnwloavmhcdn ("resume", ap-south-1). Apply with: npx supabase config push
project_id = "jkionnbbtnwloavmhcdn"

[api]
schemas = ["public"]

[db]
major_version = 17

[auth]
enabled = true
# GitHub Pages URL of the frontend
site_url = "https://cercit.github.io/resume-rag/"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:5500", "http://127.0.0.1:5500"]
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
# one-time code by email, no passwords
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

# Email templates need custom SMTP on a free project (Brevo SMTP set up 2026-10-28).
[auth.email.template.magic_link]
subject = "Your sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Your sign-in code"
content_path = "./supabase/templates/magic_link.html"

[functions.generate]
verify_jwt = true

[functions.tweak]
verify_jwt = true

# rag-check checks the service-role key itself
[functions.rag-check]
verify_jwt = false
