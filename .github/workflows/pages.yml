# Publishes site/ (the live website since 29 Oct 2026) to GitHub Pages on every push to main.
# work/, START_SITE.cmd, README.md and previews/ (design screenshots) are left out of the published copy.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Copy the site without local-only files
        run: |
          mkdir -p _publish
          cp -r site/. _publish/
          rm -rf _publish/work _publish/START_SITE.cmd _publish/README.md _publish/previews
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _publish
      - id: deployment
        uses: actions/deploy-pages@v4
